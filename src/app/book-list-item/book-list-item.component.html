<ul class="viewer-paragraph text-white">
  <li *ngFor="let child of object">
    <span *ngIf="!child.book_name" (click)="OnCollapseClicked(child)">{{
      child.key
    }}</span>
    <span *ngIf="child.book_name" (click)="OnBookClicked(child.file_name)">{{
      child.book_name
    }}</span>
    <app-book-list-item
      *ngIf="!GetCollapse(child)"
      [object]="child.value"
    ></app-book-list-item>
  </li>
</ul>
